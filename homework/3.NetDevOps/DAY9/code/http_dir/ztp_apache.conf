# QYTang ZTP Apache 配置
# 用途：替代Flask提供bootfile静态文件下载（IOS-XE ZTP下载器不兼容Flask的HTTP/1.0响应）
# 部署：复制到 /etc/httpd/conf.d/ztp_apache.conf，然后 systemctl restart httpd

<VirtualHost *:80>
    ServerName 10.10.1.205

    # ========== 静态文件：ZTP bootfile下载 ==========
    # IOS-XE ZTP bootfile下载器要求Apache/Nginx等生产级Web服务器
    Alias /download /netdevops/homework/3.NetDevOps/DAY9/code/http_dir
    <Directory /netdevops/homework/3.NetDevOps/DAY9/code/http_dir>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # ========== 动态路由：反向代理到Flask ==========
    # 排除/download路径，由Apache直接提供静态文件
    ProxyPreserveHost On
    ProxyPass /download !
    ProxyPass /ztp http://127.0.0.1:5000/ztp
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
</VirtualHost>
