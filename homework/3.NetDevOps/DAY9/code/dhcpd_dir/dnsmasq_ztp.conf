# QYTang ZTP dnsmasq DHCP 配置文件
# 用途：为C8000V提供DHCP地址分配和ZTP bootfile下发
# 部署：复制到 /etc/dnsmasq.d/ztp.conf，然后 systemctl restart dnsmasq

# DHCP地址池：10.10.1.100-199，子网掩码255.255.255.0，租期12小时
dhcp-range=10.10.1.100,10.10.1.199,255.255.255.0,12h

# 默认网关
dhcp-option=option:router,10.10.1.205

# DNS服务器
dhcp-option=option:dns-server,10.10.1.205

# 域名
dhcp-option=option:domain-name,netdevops.com

# ZTP bootfile（DHCP Option 67）：C8000V通过此URL下载Python脚本
# IOS-XE ZTP要求由Apache/Nginx提供，参见 ztp_apache.conf
# 注意：必须使用 /download 路径，这样Apache才会直接提供静态文件
dhcp-boot=http://10.10.1.205/download/ztp_device.py
