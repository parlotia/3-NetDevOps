# PYATS Testbed 配置文件 - DAY10 OSPF状态监控
# 设备信息基于实际环境配置

testbed:
  name: DAY10_OSPF_Monitor

devices:
  C8Kv1:
    alias: c8kv1
    type: router
    os: iosxe
    platform: C8000V
    credentials:
      default:
        username: admin
        password: Cisc0123
      enable:
        password: Cisc0123
    connections:
      cli:
        protocol: ssh
        ip: 10.10.1.201
        port: 22
        ssh_options: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    custom:
      abstraction:
        order: [os, type]

  C8Kv2:
    alias: c8kv2
    type: router
    os: iosxe
    platform: C8000V
    credentials:
      default:
        username: admin
        password: Cisc0123
      enable:
        password: Cisc0123
    connections:
      cli:
        protocol: ssh
        ip: 10.10.1.202
        port: 22
        ssh_options: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    custom:
      abstraction:
        order: [os, type]

topology:
  C8Kv1:
    interfaces:
      GigabitEthernet1:
        type: ethernet
        ipv4: 10.10.1.201/24
        link: management_link
  C8Kv2:
    interfaces:
      GigabitEthernet1:
        type: ethernet
        ipv4: 10.10.1.202/24
        link: management_link
